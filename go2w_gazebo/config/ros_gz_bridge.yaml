# Placeholders are expanded at launch. The launch file removes the `sensor`
# selector and excludes entries for disabled sensors before starting the bridge.
- ros_topic_name: /clock
  gz_topic_name: /world/{world_name}/clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS
- ros_topic_name: /ground_truth/poses
  gz_topic_name: /model/{robot_name}/pose
  ros_type_name: geometry_msgs/msg/PoseArray
  gz_type_name: gz.msgs.Pose_V
  direction: GZ_TO_ROS
- sensor: body_imu
  ros_topic_name: /go2w_gazebo/sensors/body_imu
  gz_topic_name: /go2w_gazebo/{robot_name}/body_imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
- sensor: lidar_imu
  ros_topic_name: /go2w_gazebo/sensors/lidar_imu
  gz_topic_name: /go2w_gazebo/{robot_name}/lidar_imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
- sensor: lidar
  ros_topic_name: /go2w_gazebo/sensors/lidar
  gz_topic_name: /go2w_gazebo/{robot_name}/lidar/points
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: gz.msgs.PointCloudPacked
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
- sensor: camera
  ros_topic_name: '{camera_image_topic}'
  gz_topic_name: /go2w_gazebo/{robot_name}/camera/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
  publisher_queue: 10
  subscriber_queue: 10
- sensor: camera
  ros_topic_name: '{camera_info_topic}'
  gz_topic_name: /go2w_gazebo/{robot_name}/camera/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS
  publisher_queue: 10
  subscriber_queue: 10
